services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golf}
      POSTGRES_DB: ${POSTGRES_DB:-airteldb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        URL_ORIGIN_CONFIRM: ${URL_ORIGIN_CONFIRM:-http://localhost:3000}
    restart: unless-stopped
    # Coexistence VPS : n'expose pas l'app en public (bind localhost uniquement).
    # Nginx (ou reverse proxy) pourra router vers 127.0.0.1:<APP_HOST_PORT>.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-golf}:${POSTGRES_PASSWORD:-golf}@db:5432/${POSTGRES_DB:-airteldb}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-golf}:${POSTGRES_PASSWORD:-golf}@db:5432/${POSTGRES_DB:-airteldb}?schema=public
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      URL_ORIGIN_CONFIRM: ${URL_ORIGIN_CONFIRM:-http://localhost:3000}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me-in-production}
      PRISMA_CONNECTION_LIMIT: ${PRISMA_CONNECTION_LIMIT:-10}
      SKIP_DB_MIGRATE: "1"
    container_name: airtelcd-app
    networks:
      - mission-outil_default
    depends_on:
      db:
        condition: service_healthy

networks:
  # Réseau Docker existant créé par le projet "mission-outil" sur le VPS.
  # Le Nginx de mission-outil pourra router vers `airtelcd-app:3000`.
  mission-outil_default:
    external: true

volumes:
  postgres_data:
